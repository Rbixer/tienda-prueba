<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2545" />
    <title>MI BARRIO · Reconectando</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0b2545;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
      }
      .mark {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.1rem;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      .mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        max-width: 18rem;
        font-size: 0.9rem;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.78);
      }
      button {
        margin-top: 0.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: #fff;
        color: #0b2545;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.75rem 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      </div>
      <h1>MI BARRIO</h1>
      <p>
        El servidor se está reiniciando o la red falló un momento.
        Reintentando automáticamente…
      </p>
      <button type="button" onclick="location.replace(location.href.split('#')[0])">
        Reintentar ahora
      </button>
    </main>
    <script>
      setTimeout(function () {
        location.replace(location.href.split("#")[0]);
      }, 2000);
    </script>
  </body>
</html>
